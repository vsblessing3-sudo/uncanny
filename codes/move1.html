<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveillance Motion Feed — Frame 1</title>

    ```
    <style>
        body {
            margin: 0;
            background-color: black;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 100%;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            opacity: 0;
        }

        img.show {
            animation: flash 2s forwards;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
    ```

</head>

<body>

    ```
    <img id="feedImage" src="1.png" alt="Movement Feed 1">

    <script>
        const image = document.getElementById("feedImage");

        function startSequence() {
            image.classList.add("show");

            setTimeout(function () {
                window.location.href = "move2.html";
            }, 2000);
        }

        if (image.complete && image.naturalWidth > 0) {
            startSequence();
        } else {
            image.addEventListener("load", startSequence, { once: true });

            image.addEventListener("error", function () {
                console.error("Could not load 1.png. Check the image filename and path.");
            }, { once: true });
        }
    </script>
    ```

</body>

</html>
