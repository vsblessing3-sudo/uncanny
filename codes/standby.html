<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAND BY...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: black;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        /* STANDBY MESSAGE */
        .standby {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        /* LOADING DOTS */
        .dots::after {
            content: "";
            animation: loading 1.5s steps(4, end) infinite;
        }
        @keyframes loading {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
            100% { content: ""; }
        }
    </style>
</head>
<body>

    <img src="standby.jpg" alt="Surveillance Standby Mode">

    <div class="standby">
        STAND BY<span class="dots"></span>
    </div>

    <script>
        setTimeout(function () {
            window.location.href = "11page.html";
        }, 5000);
    </script>

</body>
</html>
