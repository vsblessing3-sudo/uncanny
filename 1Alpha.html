<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uncanny Test Program — Candidate Intake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #050505;
            color: #ccc;
            font-family: 'Courier Prime', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border: 1px solid #222;
            background-color: #0b0b0b;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .header-label {
            font-size: 11px;
            letter-spacing: 3px;
            color: #666;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: #111;
            color: #eee;
            border: 1px solid #444;
            outline: none;
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: 15px;
            text-align: center;
            letter-spacing: 1px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: #888;
            box-shadow: 0 0 10px rgba(255,255,255,0.08);
        }
        button[type="submit"] {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: transparent;
            color: #aaa;
            border: 1px solid #444;
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button[type="submit"]:hover {
            color: #fff;
            border-color: #999;
            background-color: #1a1a1a;
        }
        .footnote {
            font-size: 10px;
            color: #444;
            margin-top: 25px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-label">CLASSIFIED EVALUATION ARCHIVE</div>

        <form id="intakeForm" action="ALPHA.html" method="get">
            <input type="text" id="candidateName" name="name" placeholder="Enter your full name..." required autocomplete="off" autofocus>
            <br>
            <button type="submit">
                [ ENTER ARCHIVE ]
            </button>
        </form>

        <div class="footnote">IDENTITY VERIFICATION REQUIRED FOR TEST RECORDING</div>
    </div>

    <script src="tracker.js"></script>
    <script>
        document.getElementById('intakeForm').addEventListener('submit', function(e) {
            var name = document.getElementById('candidateName').value.trim();
            if (name) {
                UncannyTracker.initUser(name);
            }
        });
    </script>
</body>
</html>
