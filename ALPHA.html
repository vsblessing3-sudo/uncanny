<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified Document — Uncanny Reserve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #111;
            color: #ccc;
            font-family: 'Courier Prime', 'Courier New', monospace;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background-color: #151515;
            border: 1px solid #333;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        h3 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 3px;
            color: #aaa;
        }
        .case-info {
            font-size: 12px;
            color: #777;
            letter-spacing: 2px;
            margin: 8px 0 16px;
        }
        hr {
            border: 0;
            border-top: 1px solid #333;
            margin: 15px 0 25px;
        }
        h2 {
            font-weight: normal;
            letter-spacing: 3px;
            color: #eee;
            margin: 0 0 15px;
        }
        img {
            max-width: 90%;
            max-height: 350px;
            height: auto;
            width: auto;
            border: 1px solid #282828;
            display: block;
            margin: 0 auto;
        }
        .narrative {
            font-size: 14px;
            color: #bbb;
            margin: 20px 0;
            line-height: 1.8;
        }
        .subject-tag {
            color: #7bb385;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        a.btn {
            display: inline-block;
            color: #ccc;
            text-decoration: none;
            border: 1px solid #555;
            padding: 10px 25px;
            font-size: 13px;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        a.btn:hover {
            color: #fff;
            border-color: #999;
            background-color: #222;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>UNCANNY RESERVE</h3>
        <p class="case-info">CASE FILE: 606 &nbsp;|&nbsp; ACCESS: CLASSIFIED</p>

        <hr>

        <div id="subjectGreeting" class="subject-tag">SUBJECT VERIFIED</div>

        <h2>Uncanny Co.</h2>

        <!-- IMAGE -->
        <img src="606.jpg" alt="Scene image">

        <!-- NARRATIVE -->
        <div class="narrative">
            <p>Welcome to the Uncanny Test Program.</p>
            <p>Proceed when ready.</p>
        </div>

        <!-- CHOICES -->
        <a href="computer.html" class="btn">[ Understood ]</a>

        <hr style="margin-top: 30px;">
        <small style="color: #555; font-size: 10px; letter-spacing: 1px;">RECORD ID: 606-UR-DOC</small>
    </div>

    <script src="tracker.js"></script>
    <script>
        const name = UncannyTracker.getUserName();
        if (name && name !== 'SUBJECT #606') {
            document.getElementById('subjectGreeting').textContent = 'SUBJECT VERIFIED: ' + name.toUpperCase();
        }
    </script>
</body>
</html>
