<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified Document — Virtual Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #111;
            color: #ccc;
            font-family: 'Courier Prime', 'Courier New', monospace;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background-color: #151515;
            border: 1px solid #333;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        h3 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 3px;
            color: #aaa;
        }
        .case-info {
            font-size: 12px;
            color: #777;
            letter-spacing: 2px;
            margin: 8px 0 16px;
        }
        hr {
            border: 0;
            border-top: 1px solid #333;
            margin: 15px 0 25px;
        }
        img {
            max-width: 90%;
            max-height: 350px;
            height: auto;
            width: auto;
            border: 1px solid #282828;
            display: block;
            margin: 0 auto;
        }
        .narrative {
            font-size: 14px;
            color: #bbb;
            margin: 25px 0;
            line-height: 1.8;
            font-style: italic;
        }
        a.btn {
            display: inline-block;
            color: #33ff66;
            text-decoration: none;
            border: 1px solid #33ff66;
            padding: 12px 30px;
            font-size: 13px;
            letter-spacing: 2px;
            transition: all 0.2s;
            background-color: rgba(51, 255, 102, 0.05);
        }
        a.btn:hover {
            color: #000;
            background-color: #33ff66;
            box-shadow: 0 0 15px rgba(51, 255, 102, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>UNCANNY RESERVE</h3>
        <p class="case-info">CASE FILE: 606 &nbsp;|&nbsp; ACCESS: CLASSIFIED</p>

        <hr>

        <!-- IMAGE -->
        <img src="computer.jpeg" alt="Virtual Computer Terminal">

        <!-- NARRATIVE -->
        <p class="narrative">
            "Proceed to the virtual computer to start the test."
        </p>

        <!-- CHOICES -->
        <a href="START.html" class="btn">[ START TEST ]</a>

        <hr style="margin-top: 30px;">
        <small style="color: #555; font-size: 10px; letter-spacing: 1px;">TERMINAL INTERFACE READY</small>
    </div>

</body>
</html>
