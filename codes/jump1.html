<head>

    <style>
        body {
            margin: 0;
            background-color: black;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            animation: flash 0.8s forwards;
        }
        @keyframes flash {
            0% {
                opacity: 0;
                filter: brightness(2) contrast(1.5);
            }
            10% {
                opacity: 1;
                filter: brightness(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
